name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js app
        run: npm run build
      
      - name: Start Next.js server in background
        run: |
          npm start &
          sleep 10  # Wait for server to start
          echo "Server started"
      
      - name: Run smoke test for POST /api/notes
        run: |
          # Valid payload per the frontend contract (app/components/NoteForm.tsx sends "title") — must succeed
          status=$(curl -X POST http://localhost:3000/api/notes \
            -H "Content-Type: application/json" \
            -d '{"title": "Test Note"}' \
            -o /tmp/notes_response.json \
            -w "%{http_code}" \
            -s)
          echo "Status: $status"
          cat /tmp/notes_response.json
          if [ "$status" -ge 400 ]; then
            echo "Expected POST /api/notes to succeed with a title payload, got $status"
            exit 1
          fi
      
      - name: Stop Next.js server
        run: pkill -f "next" || true